<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Terrdog420 - Unified Command Center</title>
    <style>
        @import url(https://fonts.googleapis.com/css?family=Roboto:700,900);

        :root {
            --purple-main: #A020F0;
            --purple-glow: rgba(160, 32, 240, 0.8);
            --bg-dark: #0a0a0a;
            --card-bg: #151515;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Left Side: Chat Column --- */
        #chat-column {
            width: 350px;
            min-width: 350px;
            height: 100%;
            border-right: 2px solid var(--purple-main);
            display: flex;
            flex-direction: column;
            background: #000;
        }

        .chat-header {
            padding: 10px;
            background: #111;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .refresh-btn {
            background: #333;
            color: #eee;
            border: 1px solid #444;
            padding: 4px 8px;
            font-size: 10px;
            cursor: pointer;
            text-transform: uppercase;
        }

        #chat-frame {
            flex-grow: 1;
            width: 100%;
            border: none;
        }

        /* --- Right Side: Dashboard --- */
        #dashboard-container {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header { text-align: center; margin-bottom: 40px; }
        .main-logo {
            height: 100px; width: 100px; border-radius: 50%;
            border: 4px solid var(--purple-main);
            filter: drop-shadow(0 0 15px var(--purple-glow));
            margin-bottom: 15px;
        }

        h1 { text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px var(--purple-main); font-size: 24px; margin: 0; }

        .category-title {
            color: var(--purple-main); text-transform: uppercase; font-size: 20px;
            margin: 30px 0 15px 0; border-bottom: 2px solid var(--purple-main);
            width: 100%; max-width: 800px;
        }

        .command-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px; width: 100%; max-width: 800px;
        }

        .command-card {
            background: var(--card-bg); border: 1px solid #333; border-radius: 8px;
            padding: 15px; transition: transform 0.2s, border-color 0.2s;
        }

        .command-card:hover { border-color: var(--purple-main); transform: translateY(-2px); }
        .cmd-name { color: var(--purple-main); font-size: 18px; font-weight: 900; margin-bottom: 5px; display: block; }
        .cmd-response { font-size: 13px; color: #ccc; line-height: 1.4; display: block; margin-bottom: 12px; }

        .copy-btn {
            background: var(--purple-main); color: white; border: none;
            padding: 8px 15px; border-radius: 4px; cursor: pointer;
            font-weight: 700; font-size: 11px; text-transform: uppercase;
        }

        .toast {
            position: fixed; bottom: 20px; right: 20px; background: var(--purple-main);
            padding: 10px 20px; border-radius: 20px; font-weight: 700;
            display: none; animation: slideUp 0.3s forwards; z-index: 1000;
        }

        @keyframes slideUp { from { transform: translateY(100px); } to { transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="chat-column">
        <div class="chat-header">
            <span style="font-size: 12px; color: var(--purple-main); font-weight: 900;">LIVE CHAT</span>
            <button class="refresh-btn" onclick="refreshChat()">Refresh Chat</button>
        </div>
        <iframe 
            src="https://www.twitch.tv/embed/terrdog420/chat?parent=cdpn.io&parent=localhost&parent=github.io&darkpopout" 
            id="chat-frame">
        </iframe>
    </div>

    <div id="dashboard-container">
        <div class="header">
            <img src="https://raw.githubusercontent.com/KFruti88/Universal-Stream-Overlay/main/images/terrdog420.png" class="main-logo" alt="Logo">
            <h1>Terrdog420 Dashboard</h1>
        </div>

        <div class="category-title">theHunter: Call of the Wild</div>
        <div id="hunter-commands" class="command-grid"></div>

        <div class="category-title">The Angler: Call of the Wild</div>
        <div id="angler-commands" class="command-grid"></div>

        <div class="category-title">Utility</div>
        <div id="utility-commands" class="command-grid"></div>
    </div>

    <div id="toast" class="toast">Command Copied!</div>

    <script>
        function refreshChat() {
            const iframe = document.getElementById('chat-frame');
            iframe.src = iframe.src;
        }

        const commands = {
            hunter: [
                { cmd: "!greatone", res: "Only the elite can track these. We are currently sitting on $(count greatone) 👑 GREAT ONES in the hall of fame!" },
                { cmd: "!diamond", res: "Outshining the Golds! The pack is currently showcasing $(count diamond) 💎 Diamonds in the lodge!" },
                { cmd: "!gold", res: "Keeping the momentum up! That's $(count gold) 🥇 Gold trophies in the collection!" },
                { cmd: "!silver", res: "Silver Trophies: $(count silver)" },
                { cmd: "!bronze", res: "Stuck with $(count bronze) 🥉 participation awards... we're hunting bigger game." },
                { cmd: "!levelup", res: "Gaining ground with every hunt. We've reached Level $(count level) 🆙!" }
            ],
            angler: [
                { cmd: "!greatfish", res: "Number of Legendary Fish I have $(count greatfish)" },
                { cmd: "!diamondfish", res: "Outperforming the rest with $(count diamondfish) 💎 Diamonds in the net!" },
                { cmd: "!goldfish", res: "The water is treating us well! That’s $(count goldfish) 🥇 Gold fish in the bucket!" },
                { cmd: "!silverfish", res: "Stalking the shallows and pulled in $(count silverfish) 🥈 Silvers today." },
                { cmd: "!bronzefish", res: "Caught $(count bronzefish) 🥉 bait-stealers... definitely looking for bigger fish." }
            ],
            utility: [
                { cmd: "!time", res: "$(time.timezone America/Chicago)" },
                { cmd: "!split", res: "You killed $(count split) with another player" }
            ]
        };

        function renderCommands() {
            for (let cat in commands) {
                const container = document.getElementById(`${cat}-commands`);
                commands[cat].forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'command-card';
                    card.innerHTML = `
                        <span class="cmd-name">${item.cmd}</span>
                        <span class="cmd-response">${item.res}</span>
                        <button class="copy-btn" onclick="copyToClipboard('${item.cmd}')">Copy Command</button>
                    `;
                    container.appendChild(card);
                });
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast');
                toast.innerText = text + " Copied!";
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 2000);
            });
        }

        renderCommands();
    </script>
</body>
</html>
