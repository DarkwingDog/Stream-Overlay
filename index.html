<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Terrdog420 - Master Hub v1.6</title>
    <style>
        @import url(https://fonts.googleapis.com/css?family=Roboto:700,900);

        :root {
            --hunter-green: #2e8b57;
            --angler-blue: #00ced1;
            --system-silver: #e5e4e2;
            --purple-main: #A020F0;
            --purple-glow: rgba(160, 32, 240, 0.8);
            --bg-dark: #0a0a0a;
            --card-bg: #151515;
            --trovo-green: #19d66a;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            flex-direction: row;
        }

        /* --- Dual Chat Column --- */
        #chat-column {
            width: 380px;
            min-width: 350px;
            height: 100%;
            border-right: 2px solid var(--purple-main);
            display: flex;
            flex-direction: column;
            background: #000;
        }

        .chat-header {
            padding: 10px;
            background: #111;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .refresh-btn {
            background: #333;
            color: #eee;
            border: 1px solid #444;
            padding: 6px 10px;
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
        }

        .chat-frame {
            flex-grow: 1;
            width: 100%;
            border: none;
            height: 48%; /* Split evenly between Twitch and Trovo */
        }

        .chat-label {
            padding: 5px 10px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            background: #111;
            border-bottom: 1px solid #222;
        }

        /* --- Dashboard Column --- */
        #dashboard-container {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .main-logo {
            height: 80px; width: 80px; border-radius: 50%;
            border: 3px solid var(--purple-main);
            filter: drop-shadow(0 0 10px var(--purple-glow));
            margin-bottom: 10px;
        }

        .category-title {
            text-transform: uppercase;
            font-size: 18px;
            margin: 25px 0 10px 0;
            padding-bottom: 5px;
            width: 100%;
            max-width: 800px;
            font-weight: 900;
        }

        .title-hunter { color: var(--hunter-green); border-bottom: 2px solid var(--hunter-green); }
        .title-angler { color: var(--angler-blue); border-bottom: 2px solid var(--angler-blue); }
        .title-system { color: var(--system-silver); border-bottom: 2px solid var(--system-silver); }

        .command-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
        }

        .command-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
        }

        .card-hunter { border: 1px solid var(--hunter-green); }
        .card-angler { border: 1px solid var(--angler-blue); }
        .card-system { border: 1px solid var(--system-silver); }

        .cmd-name { font-size: 17px; font-weight: 900; }
        .cmd-response { font-size: 12px; color: #ccc; display: block; margin-bottom: 12px; }

        .copy-btn {
            color: white; border: none; padding: 12px 20px; border-radius: 6px;
            cursor: pointer; font-weight: 700; width: 100%; text-transform: uppercase;
        }
        .btn-hunter { background: var(--hunter-green); }
        .btn-angler { background: var(--angler-blue); color: #000; }
        .btn-system { background: var(--system-silver); color: #000; }

        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--purple-main); padding: 12px 25px; border-radius: 30px;
            font-weight: 700; display: none; z-index: 2000;
        }

        @media (max-width: 800px) {
            body { flex-direction: column; overflow-y: auto; height: auto; }
            #chat-column { width: 100%; min-width: 100%; height: 500px; border-right: none; border-bottom: 2px solid var(--purple-main); }
            .command-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="chat-column">
        <div class="chat-header">
            <span style="font-size: 12px; color: var(--purple-main); font-weight: 900;">DUAL CHAT</span>
            <button class="refresh-btn" onclick="refreshChats()">Refresh Both</button>
        </div>
        
        <div class="chat-label" style="color: #9146ff;">Twitch</div>
        <iframe src="https://www.twitch.tv/embed/terrdog420/chat?parent=darkwingdog.github.io&parent=cdpn.io&parent=localhost&darkpopout" class="chat-frame" id="twitch-frame"></iframe>
        
        <div class="chat-label" style="color: var(--trovo-green); border-top: 1px solid #333;">Trovo</div>
        <iframe src="https://player.trovo.live/chat/DarkTerr420" class="chat-frame" id="trovo-frame"></iframe>
    </div>

    <div id="dashboard-container">
        <div class="header">
            <img src="https://raw.githubusercontent.com/KFruti88/Universal-Stream-Overlay/main/images/terrdog420.png" class="main-logo">
            <h1 style="font-size: 20px;">TERRDOG420 HUB</h1>
        </div>

        <div class="category-title title-hunter">Hunter: Call of the Wild</div>
        <div id="hunter-commands" class="command-grid"></div>

        <div class="category-title title-angler">The Angler: Call of the Wild</div>
        <div id="angler-commands" class="command-grid"></div>

        <div class="category-title title-system">StreamElements Commands</div>
        <div id="system-commands" class="command-grid"></div>
    </div>

    <div id="toast" class="toast">COPIED!</div>

    <script>
        function refreshChats() {
            document.getElementById('twitch-frame').src += '';
            document.getElementById('trovo-frame').src += '';
        }

        const commands = {
            hunter: [
                { cmd: "!greatone", res: "Only the elite can track these. We are currently sitting on $(count greatone) 👑 GREAT ONES in the hall of fame!" },
                { cmd: "!diamond", res: "Outshining the Golds! The pack is currently showcasing $(count diamond) 💎 Diamonds in the lodge!" },
                { cmd: "!gold", res: "Keeping the momentum up! That's $(count gold) 🥇 Gold trophies in the collection!" },
                { cmd: "!silver", res: "Silver Trophies: $(count silver)" },
                { cmd: "!bronze", res: "Stuck with $(count bronze) 🥉 participation awards... we're hunting bigger game." },
                { cmd: "!levelup", res: "Gaining ground with every hunt. We've reached Level $(count level) 🆙!" }
            ],
            angler: [
                { cmd: "!greatfish", res: "Number of Legendary Fish I have $(count greatfish)" },
                { cmd: "!diamondfish", res: "Outperforming the rest with $(count diamondfish) 💎 Diamonds in the net!" },
                { cmd: "!goldfish", res: "The water is treating us well! That’s $(count goldfish) 🥇 Gold fish in the bucket!" },
                { cmd: "!silverfish", res: "Stalking the shallows and pulled in $(count silverfish) 🥈 Silvers today." },
                { cmd: "!bronzefish", res: "Caught $(count bronzefish) 🥉 bait-stealers... definitely looking for bigger fish." }
            ],
            system: [
                { cmd: "!settitle", res: "Update the stream title." },
                { cmd: "!setgame", res: "Update the channels game." },
                { cmd: "!editcounter", res: "Edit custom counters." },
                { cmd: "!watchtime", res: "Check your total watch time." },
                { cmd: "!uptime", res: "Check how long the stream is live." },
                { cmd: "!tip", res: "Link to tip the channel." },
                { cmd: "!top", res: "Show the points leaderboard." },
                { cmd: "!followage", res: "Check follow duration." },
                { cmd: "!commands", res: "View all chat commands." },
                { cmd: "!accountage", res: "Twitch account creation date." }
            ]
        };

        function renderCommands() {
            for (let cat in commands) {
                const container = document.getElementById(`${cat}-commands`);
                commands[cat].forEach(item => {
                    const card = document.createElement('div');
                    card.className = `command-card card-${cat}`;
                    card.innerHTML = `
                        <span class="cmd-name" style="color: var(--${cat === 'system' ? 'system-silver' : cat === 'hunter' ? 'hunter-green' : 'angler-blue'})">${item.cmd}</span>
                        <p class="cmd-response">${item.res}</p>
                        <button class="copy-btn btn-${cat}" onclick="copyToClipboard('${item.cmd}')">Copy Command</button>
                    `;
                    container.appendChild(card);
                });
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast');
                toast.innerText = text + " COPIED!";
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 2000);
            });
        }

        window.onload = () => {
            renderCommands();
        };
    </script>
</body>
</html>
